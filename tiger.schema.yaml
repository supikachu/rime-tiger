schema:
  author:
    - {}
  dependencies:
    - pinyin_simp
  description: |
    虎码官方单字
    敲 ` 鍵進入拼音反查    
  name: "虎码官方单字"
  schema_id: tiger
  version: 0.9

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
#  - name: full_shape
#    states: [ 半角, 全角 ]
#  - name: extended_charset
#    states: [ 常用, 增廣 ]
#  - name: ascii_punct
#    states: [ 。，, ．， ]
  # 「GBK/GB2312/UTF-8」三档也是死配置（2026-09-20 核对 librime 1.7.3 / 1.11.2 / 1.13.0 三个
  # tag，源码一致）：CharsetFilter::Apply 只在**无参**命名空间下过滤，且靠 `extended_charset`
  # 开关决定；带 @gbk/@utf8/@gb2312 参数时它只打一条
  # LOG(ERROR) "charset parameter is unsupported by basic charset_filter" 然后原样放行。
  # 要真限字集，见 README「字集过滤怎么做」。
#  - options: [ gbk, gb2312, utf8 ]
#    reset: 2
#    states:
#    - GBK
#    - GB2312
#    - UTF-8

# 仓「自定义键盘」时代遗留（option 名 _keyboard_default / _keyboard_defaultzj）：
# 元书已移除自定义键盘，Write2026 皮肤也不读这两个 option，纯属无人消费的开关。
#  - options: [ _keyboard_default, _keyboard_defaultzj]
#    states: [ "助记关", "助记开"]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - table_translator
  filters:
#    - simplifier
    - uniquifier
    # 带参数的字符集过滤在现行 librime 里是空转（理由见 switches 处注释），只会刷日志，已注释。
    # 想去掉扩展区汉字：取消上面那行 `extended_charset` 开关的注释，并把下面三行换成一行无参
    # `- charset_filter`。
#    - charset_filter@gbk
#    - charset_filter@utf8
#    - charset_filter@gb2312
#    - charset_filter@big5
#    - reverse_lookup_filter@reverse_lookup

speller:
  auto_clear: max_length
  auto_select: true
  max_code_length: 4


translator:
  dictionary: tiger
  enable_charset_filter: false
  enable_encoder: true
  enable_sentence: false
  encode_commit_history: true
  max_phrase_length: 4
  enable_user_dict: false

reverse_lookup:
  dictionary: pinyin_simp
  preedit_format:
    - "xform/([nl])v/$1ü/"
    - "xform/([nl])ue/$1üe/"
    - "xform/([jqxy])v/$1u/"
  prefix: "`"
  suffix: "'"
  tips: "〔拼音〕"

punctuator:
  import_preset: symbols

key_binder:
#  import_preset: default
  bindings:
    - {accept: semicolon, send: 2, when: has_menu}

recognizer:
  import_preset: default
  patterns:
    punct: '^/([0-9]0?|[A-Za-z]+)$'
    reverse_lookup: "^`[a-z]*'?$"

ascii_composer:
  switch_key:
    Caps_Lock: clear
    Control_L: noop
    Control_R: noop
    Eisu_toggle: clear
    Shift_L: commit_code
    Shift_R: commit_text


#menu:
#  page_size: 3




